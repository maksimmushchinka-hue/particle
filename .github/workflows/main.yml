name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find pom.xml
        id: pom
        run: |
          POM=$(find . -name pom.xml -not -path './.git/*' | head -n 1)
          if [ -z "$POM" ]; then
            echo "pom.xml не найден в репозитории! Загрузите pom.xml и папку src."
            ls -R
            exit 1
          fi
          echo "Нашли: $POM"
          echo "path=$POM" >> "$GITHUB_OUTPUT"

      - name: Build with Maven
        run: mvn -B -ntp -f "${{ steps.pom.outputs.path }}" clean package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: AtomParticles
          path: '**/target/AtomParticles.jar'

      - name: Publish release (on tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '**/target/AtomParticles.jar'
